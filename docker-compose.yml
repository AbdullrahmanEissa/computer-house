version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_static:/var/www/next/static:ro
      - frontend_public:/var/www/next/public:ro
    depends_on:
      - web
      - frontend
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    networks:
      - app_network

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - app_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_URL=http://web:8000
    volumes:
      - frontend_static:/app/.next/static
      - frontend_public:/app/public
    env_file:
      - .env
    environment:
      - API_URL=http://web:8000
      - NEXT_PUBLIC_API_URL=/
    depends_on:
      - web
    networks:
      - app_network

volumes:
  frontend_static:
  frontend_public:

networks:
  app_network:
    driver: bridge
