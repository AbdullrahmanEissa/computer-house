events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream backend_api {
        server web:8000;
    }

    upstream frontend_app {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # -------------------------------------------------------------
        # 1. WEB SERVER: Serve Next.js static assets directly from disk
        # -------------------------------------------------------------
        location /_next/static/ {
            alias /var/www/next/static/;
            expires 365d;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # -------------------------------------------------------------
        # 2. WEB SERVER: Serve public root assets (favicon, robots, etc.)
        # -------------------------------------------------------------
        location ~* ^/(favicon\.ico|robots\.txt|.*\.svg|.*\.png|.*\.jpg)$ {
            root /var/www/next/public;
            expires 30d;
            access_log off;
            try_files $uri @proxy_to_frontend;
        }

        # -------------------------------------------------------------
        # 3. REVERSE PROXY: FastAPI endpoints
        # -------------------------------------------------------------
        # Map frontend checkout calls directly to FastAPI orders
        location = /api/checkout {
            proxy_pass http://backend_api/api/orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Idempotency-Key $http_idempotency_key;
        }

        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend_api/health;
            proxy_set_header Host $host;
        }

        # -------------------------------------------------------------
        # 4. REVERSE PROXY: Dynamic SSR/HTML to Next.js
        # -------------------------------------------------------------
        location / {
            try_files $uri @proxy_to_frontend;
        }

        location @proxy_to_frontend {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
